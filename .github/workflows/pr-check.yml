name: PR Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, build, and API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Check removed Spotify metadata
        run: pnpm run check:no-spotify-metadata

      - name: Run API tests with mock DB
        run: pnpm run test:api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soundlog_ci?schema=public
          JWT_SECRET: soundlog-ci-test-secret
          NODE_ENV: test
          USE_MOCK_DB: 'true'
