      description: 리캡을 나만보기 또는 전체공개로 변경합니다. 전체공개 리캡은 대표 위치가 있어야 하며, 위치가 없으면 BAD_REQUEST를 반환합니다.
      operationId: updateRecapVisibility
      parameters:
        - name: recapId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecapVisibilityUpdateRequest"
      responses:
        "200":
          description: 공개 범위가 변경된 리캡
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/recaps/{recapId}/thumbnail:
    patch:
      tags:
        - Recaps
      summary: 로그 썸네일 리캡 지정
      description: 내 여행 로그에 포함된 리캡 하나를 대표 썸네일로 지정합니다. 지정하지 않은 로그는 시간순 첫 리캡을 기본 썸네일로 사용합니다.
      operationId: updateRecapThumbnail
      parameters:
        - name: recapId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecapThumbnailUpdateRequest"
      responses:
        "200":
          description: 썸네일이 변경된 여행 로그
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/recaps/{recapId}/share-events:
    post:
      tags:
        - Recaps
      summary: 리캡 저장/공유 이벤트 적재
      operationId: createRecapShareEvent
      parameters:
        - name: recapId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecapShareEventRequest"
      responses:
        "202":
          description: 이벤트 적재 요청 수락
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/travel-rooms:
    get:
      tags:
        - Community
      summary: 내 공동 여행방 목록 조회
      description: 인증된 사용자가 방장 또는 참여자로 속한 공동 여행방을 최근 수정순으로 조회합니다. sessionId를 전달하면 현재 여행 세션의 방을 복구할 수 있습니다.
      operationId: getTravelRooms
      parameters:
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 공동 여행방 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelRoomListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags:
        - Community
      summary: 공동 여행방 생성
      description: 인증된 사용자를 방장(owner)으로 공동 여행방을 생성합니다.
      operationId: createTravelRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelRoomCreateRequest"
      responses:
        "201":
          description: 생성된 공동 여행방
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelRoomResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/travel-rooms/join:
    post:
      tags:
        - Community
      summary: 초대 코드로 공동 여행방 참여
      description: roomId 없이 초대 코드만으로 공동 여행방에 참여합니다. 입력한 초대 코드는 서버에서 대문자로 정규화됩니다.
      operationId: joinTravelRoomByInviteCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelRoomJoinByInviteRequest"
      responses:
        "200":
          description: 참여 후 공동 여행방
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelRoomResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/travel-rooms/{roomId}:
    get:
      tags:
        - Community
      summary: 공동 여행방 조회
      description: 방장 또는 참여자만 공동 여행방 상세, 멤버, 후보 순간, 댓글을 조회할 수 있습니다.
      operationId: getTravelRoom
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 공동 여행방
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelRoomResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/travel-rooms/{roomId}/join:
    post:
      tags:
        - Community
      summary: 공동 여행방 참여
      description: 이미 참여한 사용자는 바로 방 정보를 받으며, 신규 참여자는 초대 코드가 필요합니다.
      operationId: joinTravelRoom
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelRoomJoinRequest"
      responses:
        "200":
          description: 참여 후 공동 여행방
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelRoomResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/travel-rooms/{roomId}/moments:
    post:
      tags:
        - Community
      summary: 공동 Recap 후보 순간 추가
      description: 방장 또는 참여자만 사진/곡/장소가 붙은 공동 Recap 후보 순간을 추가할 수 있습니다.
      operationId: addTravelRoomMoment
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelRoomMomentCreateRequest"
      responses:
        "201":
          description: 추가된 공동 순간
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelRoomMomentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/travel-rooms/{roomId}/moments/{momentId}:
    patch:
      tags:
        - Community
      summary: 공동 Recap 후보 상태 변경
      description: 방장만 후보를 candidate, accepted, rejected 상태로 변경할 수 있습니다.
      operationId: updateTravelRoomMoment
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: momentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelRoomMomentUpdateRequest"
      responses:
        "200":
          description: 변경된 공동 순간
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelRoomMomentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/travel-rooms/{roomId}/moments/{momentId}/comments:
    post:
      tags:
        - Community
      summary: 공동 Recap 후보 댓글 추가
      description: 방장 또는 참여자만 공동 순간에 댓글을 남길 수 있습니다.
      operationId: addTravelRoomMomentComment
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: momentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelRoomMomentCommentCreateRequest"
      responses:
        "201":
          description: 추가된 댓글
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelRoomMomentCommentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/travel-rooms/{roomId}/recaps:
    post:
      tags:
        - Community
      summary: 공동 Recap 생성
      description: 방장만 공동 Recap을 생성할 수 있으며, accepted 후보 순간이 있으면 accepted만 우선 사용합니다.
      operationId: createTravelRoomRecap
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelRoomRecapCreateRequest"
      responses:
        "201":
          description: 생성된 공동 Recap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapItemResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/sound-map:
    get:
      tags:
        - Community
      summary: Live Sound Map 핀 조회
      description: 좌표가 있으면 반경 내 핀을 반환합니다. `nearby` 핀은 주변 익명 공개 사용자에게 보이고, `companions` 핀은 내 핀 또는 나와 같은 공동 여행방에 참여한 사용자에게만 보입니다. `private` 핀은 본인에게만 반환됩니다.
      operationId: getSoundMap
      parameters:
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radiusMeters
          in: query
          schema:
            type: integer
            default: 3000
        - name: visibility
          in: query
          schema:
            type: string
            enum: [companions, nearby]
      responses:
        "200":
          description: 지도 핀 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundMapPinListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/sound-map/current-track:
    post:
      tags:
        - Community
      summary: 현재 선택 곡을 지도에 공개
      description: 서버에 active 여행 세션이 있는 사용자만 현재 선택 곡과 대략 위치를 지도에 공개할 수 있습니다. visibility를 private으로 보내면 기존 공개 핀을 숨깁니다.
      operationId: upsertSoundMapCurrentTrack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoundMapCurrentTrackRequest"
      responses:
        "202":
          description: 공개 상태 저장
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundMapPinResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/sound-map/nearby:
    get:
      tags:
        - Community
      summary: 주변 익명 사운드 핀 조회
      description: 위치 권한 없이 호출하면 낯선 사용자 핀을 노출하지 않고 빈 목록을 반환합니다.
      operationId: getNearbySounds
      parameters:
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radiusMeters
          in: query
          schema:
            type: integer
            default: 3000
        - name: state
          in: query
          schema:
            type: string
        - name: mood
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 주변 익명 사운드 핀
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundMapPinListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/music-matches:
    get:
      tags:
        - Community
      summary: 주변 음악 취향 매칭 후보 조회
      description: 위치 권한 없이 호출하면 낯선 사용자 매칭 후보를 노출하지 않고 빈 목록을 반환합니다.
      operationId: getMusicMatches
      parameters:
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radiusMeters
          in: query
          schema:
            type: integer
            default: 3000
        - name: state
          in: query
          schema:
            type: string
        - name: mood
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 취향 매칭 후보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicMatchListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/travel-mate-requests:
    get:
      tags:
        - Community
      summary: 동행 매칭 요청 목록 조회
      description: 받은 요청함, 보낸 요청함, 전체 요청을 조회합니다. 수락 전에는 연락처와 정확한 위치가 응답에 포함되지 않습니다.
      operationId: getTravelMateRequests
      parameters:
        - name: box
          in: query
          schema:
            type: string
            enum:
              - all
              - inbox
              - sent
            default: all
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - accepted
              - declined
              - expired
              - cancelled
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 동행 매칭 요청 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelMateRequestListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags:
        - Community
      summary: 동행 매칭 요청 생성
      description: >
        대상 사용자가 주변 익명 공개 핀을 유지 중일 때만 요청을 생성합니다.
        pending/accepted 요청은 기존 요청을 재사용하고, 거절/취소/만료된 같은 대상 요청은 24시간 동안 재요청을 제한합니다.
        서로 차단한 관계에서는 요청을 생성할 수 없습니다.
      operationId: createTravelMateRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelMateRequestCreateRequest"
      responses:
        "201":
          description: 생성된 동행 매칭 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelMateRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/travel-mate-requests/{requestId}:
    patch:
      tags:
        - Community
      summary: 동행 매칭 요청 상태 변경
      description: 수신자는 accept/decline, 발신자는 cancel, 시스템 또는 운영 도구는 expire 액션을 사용할 수 있습니다.
      operationId: updateTravelMateRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelMateRequestUpdateRequest"
      responses:
        "200":
          description: 변경된 동행 매칭 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelMateRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/community/blocks:
    post:
      tags:
        - Community
      summary: 커뮤니티 사용자 차단
      operationId: blockCommunityUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetType:
                  type: string
                  enum: [user, sound_pin, recap, travel_room_moment, travel_room_comment, mate_request]
                targetContentId:
                  type: string
                targetUserId:
                  type: string
                  description: 대상 사용자 ID를 알고 있을 때 사용합니다.
                targetPinId:
                  type: string
                  description: 익명 사운드맵 핀을 기준으로 서버가 대상 사용자를 찾아 차단합니다.
      responses:
        "202":
          description: 차단 요청 수락
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/community/reports:
    post:
      tags:
        - Community
      summary: 커뮤니티 신고
      operationId: reportCommunityTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportRequest"
      responses:
        "202":
          description: 신고 요청 수락
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportAcceptedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/moderation/reports:
    get:
      security:
        - moderationAdminKey: []
      tags: [ModerationAdmin]
      summary: 신고 운영 큐 조회
      operationId: listModerationReports
      parameters:
        - name: x-soundlog-admin-key
          in: header
          required: true
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, resolved, dismissed]
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200": { description: 처리 기한이 빠른 순서의 신고 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/moderation/reports/{reportId}:
    patch:
      security:
        - moderationAdminKey: []
      tags: [ModerationAdmin]
      summary: 신고 해결 및 콘텐츠 삭제와 사용자 제재
      operationId: resolveModerationReport
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string }
        - name: x-soundlog-admin-key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, note]
              properties:
                action:
                  type: string
                  enum: [dismiss, hide_content, hide_and_suspend]
                note: { type: string, maxLength: 500 }
      responses:
        "200": { description: 처리된 신고 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/moderation/content:
    get:
      security:
        - moderationAdminKey: []
      tags: [ModerationAdmin]
      summary: 공개 전 이미지 검토 대기 목록 조회
      operationId: listPendingModerationContent
      parameters:
        - name: x-soundlog-admin-key
          in: header
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200": { description: 검토 대기 콘텐츠 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/moderation/content-images/{fileId}:
    get:
      security:
        - moderationAdminKey: []
      tags: [ModerationAdmin]
      summary: 관리자용 검토 대기 이미지 조회
      operationId: getPendingModerationContentImage
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{32}$"
        - name: x-soundlog-admin-key
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 검토할 이미지 원본
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/moderation/content/{contentId}:
    patch:
      security:
        - moderationAdminKey: []
      tags: [ModerationAdmin]
      summary: 공개 이미지 승인 또는 거절
      operationId: reviewModerationContent
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { type: string }
        - name: x-soundlog-admin-key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, decision]
              properties:
                type:
                  type: string
                  enum: [moment_log, recap]
                decision:
                  type: string
                  enum: [approved, rejected]
      responses:
        "200": { description: 검토 결과 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/moderation/sweep:
    post:
      security:
        - moderationAdminKey: []
      tags: [ModerationAdmin]
      summary: 20시간 알림과 24시간 초과 신고 점검
      operationId: sweepModerationDeadlines
      parameters:
        - name: x-soundlog-admin-key
          in: header
          required: true
          schema: { type: string }
      responses:
        "200": { description: 점검 결과 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/travel-sessions:
    post:
      tags:
        - TravelSessions
      summary: 여행 세션 시작
      operationId: createTravelSession
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelSessionCreateRequest"
      responses:
        "201":
          description: 시작된 여행 세션
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/travel-sessions/{sessionId}:
    patch:
      tags:
        - TravelSessions
      summary: 여행 세션 상태 변경
      description: 세션을 ended로 변경하면 해당 세션에서 공개 중이던 사운드맵 핀은 즉시 private 상태로 전환되고 만료됩니다.
      operationId: updateTravelSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelSessionUpdateRequest"
      responses:
        "200":
          description: 변경된 여행 세션
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/trends/regions/{regionCode}/sound:
    get:
      tags:
        - Trends
      summary: 지역 사운드 트렌드 조회
      description: 로그인 사용자에게 제공할 지역 기반 인기 음악/무드 집계입니다.
      operationId: getRegionSoundTrend
      parameters:
        - name: regionCode
          in: path
          required: true
          description: 행정구역 또는 서비스 내부 지역 코드.
          schema:
            type: string
          example: KR-26
        - name: period
          in: query
          schema:
            type: string
            enum:
              - daily
              - weekly
              - monthly
            default: weekly
      responses:
        "200":
          description: 지역 사운드 트렌드
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionSoundTrendResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    moderationAdminKey:
      type: apiKey
      in: header
      name: x-soundlog-admin-key

  parameters:
    Lat:
      name: lat
      in: query
      required: true
      description: 위도
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
      example: 35.1532
    Lng:
      name: lng
      in: query
      required: true
      description: 경도
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
      example: 129.1186
    OptionalLat:
      name: lat
      in: query
      required: false
      description: 위도
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    OptionalLng:
      name: lng
      in: query
      required: false
      description: 경도
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
    Cursor:
      name: cursor
      in: query
      required: false
      description: 다음 페이지 조회용 커서
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 조회 개수
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 중복 요청 방지를 위한 클라이언트 생성 키
      schema:
        type: string
        maxLength: 128

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 인증 실패 또는 토큰 만료
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - status
            - checkedAt
          properties:
            status:
              type: string
              enum:
                - ok
            checkedAt:
              type: string
              format: date-time

    DbTestRecordCreateRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
          default: swagger-db-test
          example: swagger-smoke-test
        payload:
          type: object
          additionalProperties: true
          example:
            source: swagger
            note: DB insert 확인용

    DbTestRecord:
      type: object
      required:
        - id
        - label
        - createdAt
        - database
        - table
      properties:
        id:
          type: string
          example: cmabc123def456
        label:
          type: string
          example: swagger-smoke-test
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        database:
          type: string
          enum:
            - postgres
            - mock-db
          example: postgres
        table:
          type: string
          enum:
            - DbTestRecord
          example: DbTestRecord

    DbTestRecordResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/DbTestRecord"

    AcceptedResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - accepted
          properties:
            accepted:
              type: boolean
              example: true

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: 요청한 리소스를 찾을 수 없습니다.
            details:
              type: object
              additionalProperties: true

    PageInfo:
      type: object
      required:
        - limit
      properties:
        limit:
          type: integer
          example: 20
        nextCursor:
          type:
            - string
            - "null"
          example: cursor_2026_05_26

    GeoPoint:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: double
          example: 35.1532
        lng:
          type: number
          format: double
          example: 129.1186

    RoutePoint:
      allOf:
        - $ref: "#/components/schemas/GeoPoint"
        - type: object
          required:
            - recordedAt
          properties:
            recordedAt:
              type: string
              format: date-time
              example: "2026-07-12T04:38:00.000Z"
            accuracyMeters:
              type: number
              format: double
              minimum: 0
              example: 12

    TravelMode:
      type: string
      description: 여행 상황 모드
      enum:
        - walk
        - drive
        - cafe
        - ocean
        - festival
        - night

    MusicRecommendationMode:
      type: string
      description: 홈 추천 토글 모드. `everyday`는 평소 취향, `travel`은 관광 장소 맥락을 우선합니다.
      enum:
        - everyday
        - travel

    MoodTag:
      type: string
      description: 추천/기록에 사용하는 무드 태그
      enum:
        - calm
        - fresh
        - emotional
        - active
        - local

    MlTravelState:
      type: string
      description: ML 추천 서버와 맞춘 여행 상태
      enum:
        - 바다
        - 드라이브
        - 산책
        - 카페
        - 야경

    MlMood:
      type: string
      description: ML 추천 서버와 맞춘 음악 무드
      enum:
        - 잔잔한
        - 신나는
        - 시원한
        - 설레는
        - 감성적인

    PlaceContext:
      type: object
      required:
        - id
        - source
        - title
      properties:
        id:
          type: string
          description: 한국관광공사 contentid 또는 Soundlog 내부 장소 ID
          example: "126078"
        title:
          type: string
          example: 광안리해수욕장
        address:
          type: string
          example: 부산광역시 수영구 광안해변로 219
        category:
          type: string
          description: 관광공사 카테고리 또는 Soundlog 정규화 카테고리
          example: 해변
        contentType:
          type: string
          example: 관광지
        distanceMeters:
          type: integer
          example: 430
        imageUrl:
          type: string
          format: uri
        location:
          $ref: "#/components/schemas/GeoPoint"
        overview:
          type: string
          example: 부산을 대표하는 도심 해변 관광지입니다.
        attribution:
          type: string
          description: 외부 위치 데이터 표시 의무가 있을 때 사용하는 출처 문구
          example: © OpenStreetMap contributors
        source:
          type: string
          enum:
            - tour-api
            - seed
            - user
            - reverse-geocode

    Track:
      type: object
      required:
        - id
        - title
        - artist
      properties:
        id:
          type: string
          example: track_001
        title:
          type: string
          example: Ocean Drive
        artist:
          type: string
          example: Soundlog Curator
        fallbackColor:
          type: string
          example: "#31206D"
        albumImageUrl:
          type: string
          format: uri
        externalUrl:
          type: string
          format: uri
        platformUrls:
          type: object
          properties:
            melon:
              type: string
              format: uri
            youtubeMusic:
              type: string
              format: uri
        isLiked:
          type: boolean
        isSaved:
          type: boolean

    FeaturedPlaylist:
      type: object
      required:
        - id
        - regionName
        - description
        - trackCount
        - durationText
      properties:
        id:
          type: string
          example: busan-ocean-walk
        regionName:
          type: string
          example: 부산
        description:
          type: string
          example: 부산광역시에 어울리는 노래를 추천해드립니다.
        coverImageUrl:
          type: string
          format: uri
        backgroundImageUrl:
          type: string
          format: uri
        trackCount:
          type: integer
          example: 12
        durationText:
          type: string
          example: 40:00분
        source:
          type: string
          enum:
            - location
            - trend
            - personalized
          example: location

    MoodRecommendation:
      type: object
      required:
        - id
        - title
        - color
        - track
      properties:
        id:
          type: string
          example: fresh-drive-pop
        title:
          type: string
          example: Music Genre
        subtitle:
          type: string
          example: 드라이브에 어울리는 청량한 팝
        color:
          type: string
          example: "#31206D"
        genres:
          type: array
          items:
            type: string
          example:
            - 팝
            - K-POP
        imageUrl:
          type: string
          format: uri
          description: 무드 추천 카드 대표 이미지.
        moods:
          type: array
          items:
            type: string
          example:
            - 시원한
            - 신나는
        travelStyles:
          type: array
          items:
            type: string
          example:
            - 드라이브
        playlistId:
          type: string
          description: 추천 카드 선택 시 바로 열 수 있는 플레이리스트 ID. 없으면 앱은 트랙 미리 재생으로 폴백합니다.
          example: drive
        track:
          $ref: "#/components/schemas/Track"

    PlaylistCuration:
      type: object
      required:
        - id
        - regionName
        - reason
        - trackCount
        - durationText
        - tracks
      properties:
        id:
          type: string
          example: busan-ocean-walk
        regionName:
          type: string
          example: 부산
        placeName:
          type: string
          example: 광안리해수욕장
        reason:
          type: string
          example: 광안리 해변 산책과 어울리는 청량한 플레이리스트예요.
        coverImageUrl:
          type: string
          format: uri
        backgroundImageUrl:
          type: string
          format: uri
        trackCount:
          type: integer
          example: 12
        durationText:
          type: string
          example: 40:00분
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        context:
          $ref: "#/components/schemas/RecommendationContext"

    LibraryPlaylistSummary:
      type: object
      required:
        - id
        - regionName
        - trackCount
        - durationText
      properties:
        id:
          type: string
          example: busan-ocean
        regionName:
          type: string
          example: 부산
        placeName:
          type: string
          example: 광안리 해변
        description:
          type: string
          example: 부산광역시에 어울리는 노래를 추천해드립니다.
        reason:
          type: string
          example: 부산 해변 산책과 어울리는 음악이에요
        coverImageUrl:
          type: string
          format: uri
        backgroundImageUrl:
          type: string
          format: uri
        trackCount:
          type: integer
          example: 5
        durationText:
          type: string
          example: 40:00분

    MusicLogItem:
      type: object
      required:
        - id
        - placeName
        - trackTitle
        - artistName
        - createdAt
      properties:
        id:
          type: string
          example: log_001
        placeName:
          type: string
          example: 광안리해수욕장
        trackTitle:
          type: string
          example: Ocean Drive
        artistName:
          type: string
          example: Soundlog Curator
        createdAt:
          type: string
          format: date-time
        imageUrl:
          type: string
          format: uri
        recapShareId:
          type: string
          example: recap_001

    UserProfileInput:
      type: object
      required:
        - locationRecommendationEnabled
        - preferredGenres
        - preferredMoods
        - travelStyles
      properties:
        companionType:
          type: string
          enum:
            - solo
            - friends
            - couple
            - family
          example: friends
        locationRecommendationEnabled:
          type: boolean
          example: true
        preferredGenres:
          type: array
          items:
            type: string
          example:
            - K-POP
            - 인디
        preferredMoods:
          type: array
          items:
            type: string
          example:
            - 청량한
            - 잔잔한
        travelStyles:
          type: array
          items:
            type: string
          example:
            - 산책
            - 카페 투어
        dislikedArtists:
          type: array
          items:
            type: string
        birthYear:
          type: integer
          minimum: 1900
          maximum: 2026
        gender:
          type: string
          enum:
            - female
            - male
            - non_binary
            - undisclosed

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/UserProfileInput"
        - type: object
          required:
            - completedOnboarding
          properties:
            completedOnboarding:
              type: boolean
              example: true
            updatedAt:
              type: string
              format: date-time

    RecommendationContext:
      type: object
      properties:
        moodFilter:
          type: string
          example: 청량한
        recommendationMode:
          $ref: "#/components/schemas/MusicRecommendationMode"
        placeCategory:
          type: string
          example: 해변
        placeId:
          type: string
          example: "126078"
        placeName:
          type: string
          example: 광안리해수욕장
        source:
          type: string
          description: 추천 산출 경로입니다. ML 추천이 실패했거나 위치가 없으면 seed-fallback으로 내려갑니다.
          enum:
            - ml-recommendation
            - seed-fallback
            - server-contextual
          example: ml-recommendation
        travelMode:
          $ref: "#/components/schemas/TravelMode"

    ContextualPlaylistRequest:
      type: object
      properties:
        location:
          $ref: "#/components/schemas/GeoPoint"
        placeId:
          type: string
        travelMode:
          $ref: "#/components/schemas/TravelMode"
        state:
          $ref: "#/components/schemas/MlTravelState"
        mood:
          $ref: "#/components/schemas/MlMood"
        moodTags:
          type: array
          description: 선택한 무드 태그입니다. 사용자가 무드를 고르지 않으면 빈 배열로 저장될 수 있습니다.
          items:
            $ref: "#/components/schemas/MoodTag"
        preferredGenres:
          type: array
          items:
            type: string
        preferredMoods:
          type: array
          items:
            type: string
        excludeTrackIds:
          type: array
          items:
            type: string

    LibraryTrackUpdateRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - like
            - unlike
            - save
            - unsave
        playlistId:
          type: string
        context:
          $ref: "#/components/schemas/RecommendationContext"

    LibraryTrackState:
      type: object
      required:
        - trackId
        - isLiked
        - isSaved
      properties:
        trackId:
          type: string
        isLiked:
          type: boolean
        isSaved:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    LibraryTrackRecord:
      type: object
      required:
        - createdAt
        - track
      properties:
        createdAt:
          type: string
          format: date-time
        playlistId:
          type: string
          description: 이 곡이 저장될 때 연결된 추천 플레이리스트 ID입니다.
        playlist:
          $ref: "#/components/schemas/LibraryPlaylistSummary"
        kind:
          type: string
          enum:
            - liked
            - saved
        track:
          $ref: "#/components/schemas/Track"

    MomentLogCreateForm:
      type: object
      description: 내부 저장 모델명은 MomentLog지만 외부 계약에서는 리캡 캡처 생성 폼으로 사용합니다.
      required:
        - createdAt
        - moodTags
      properties:
        photo:
          type: string
          format: binary
          description: 카메라 촬영 이미지 파일. 사진 없이 음악/장소 리캡만 저장할 때는 생략할 수 있습니다.
        createStandaloneRecap:
          type: boolean
          description: 독립 캡처의 리캡 공유 데이터까지 한 요청에서 생성할지 여부입니다. 새 앱이 true로 전송하며 생략하면 기존 클라이언트 방식으로 캡처만 생성합니다.
        createdAt:
          type: string
