openapi: 3.1.0
info:
  title: Soundlog API
  version: 0.1.0
  summary: 위치 기반 관광 음악 추천 및 여행 리캡 API
  license:
    name: SoundLogTeam Internal
    url: https://github.com/SoundLogTeam/api-docs
  description: |
    Soundlog React Native 앱과 백엔드 서버를 연결하기 위한 API 명세입니다.

    MVP 범위는 홈 추천, 관광지 조회, 플레이리스트 상세, 리캡 캡처, 여행 로그, 보관함, 추천 피드백 수집,
    여행 세션, 공동 여행방, Live Sound Map, 음악 취향 매칭을 포함합니다.
    한국관광공사 OpenAPI 원본 응답은 서버에서 Soundlog 도메인 모델로 정규화해서 앱에 전달합니다.
servers:
  - url: http://localhost:4000
    description: Local Docker/API server
  - url: https://api.soundlog.p-e.kr
    description: Production API
tags:
  - name: System
    description: 서버 상태 확인
  - name: Dev
    description: 개발/검증용 엔드포인트
  - name: Auth
    description: 간편 로그인 및 토큰 관리
  - name: Me
    description: 사용자 프로필과 계정 데이터 관리
  - name: Tour
    description: 관광공사 데이터 기반 장소 컨텍스트
  - name: Home
    description: 홈 화면 추천 데이터
  - name: Playlists
    description: 장소/무드 기반 플레이리스트
  - name: MomentLogs
    description: 레거시 순간 기록 API. 신규 클라이언트는 RecapCaptures를 사용합니다.
  - name: RecapCaptures
    description: 카메라로 남기는 단발성 리캡 저장 API
  - name: Recaps
    description: 여행 로그 목록, 리캡 지도 마커 및 공유 콘텐츠
  - name: Library
    description: 좋아요/저장 음악 보관함
  - name: RecommendationEvents
    description: 추천 품질 개선을 위한 행동 로그
  - name: TravelSessions
    description: 여행 세션 시작/종료
  - name: Trends
    description: 지역 사운드 트렌드
  - name: Community
    description: 공동 여행방, Live Sound Map, 취향 매칭, 신고/차단
  - name: ModerationAdmin
    description: 관리자 키로 보호되는 신고 및 공개 콘텐츠 운영 API
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      tags:
        - System
      security: []
      summary: 서버 상태 확인
      operationId: getHealth
      responses:
        "200":
          description: 서버가 정상 동작 중입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: 서버가 일시적으로 사용할 수 없는 상태입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/dev/db-test-records:
    post:
      tags:
        - Dev
      security: []
      summary: 인증 없는 DB 쓰기 테스트
      description: |
        Swagger UI에서 DB 쓰기를 빠르게 검증하기 위한 개발용 endpoint입니다.
        실제 DB 모드에서는 `DbTestRecord` 테이블에 row를 생성하고, mock DB 모드에서는 mock 응답을 반환합니다.
      operationId: createDbTestRecord
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DbTestRecordCreateRequest"
            example:
              label: swagger-smoke-test
              payload:
                source: swagger
                note: DB insert 확인용
      responses:
        "201":
          description: DB 테스트 record 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DbTestRecordResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/auth/login:
    post:
      tags:
        - Auth
      security: []
      summary: 자체 계정 로그인
      description: |
        Soundlog 이메일/비밀번호 계정으로 access token과 refresh token을 발급합니다.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/register:
    post:
      tags:
        - Auth
      security: []
      summary: 자체 계정 가입
      description: |
        Soundlog 이메일/비밀번호 계정을 만들고 access token과 refresh token을 발급합니다.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 가입 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/auth/refresh:
    post:
      tags:
        - Auth
      security: []
      summary: 토큰 재발급
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/logout:
    post:
      tags:
        - Auth
      security: []
      summary: 로그아웃 및 refresh token 무효화
      description: |
        클라이언트가 보관 중인 refresh token을 서버에서 무효화합니다.
        서버 요청이 실패해도 앱은 로컬 access/refresh token을 삭제해야 합니다.
      operationId: logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "202":
          description: 로그아웃 요청 수락
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/me:
    get:
      tags:
        - Me
      summary: 내 계정과 프로필 요약 조회
      operationId: getMe
      responses:
        "200":
          description: 로그인 사용자와 취향 프로필 요약
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
        - Me
      summary: 내 계정과 연결 데이터 즉시 삭제
      description: 사용자 계정, 토큰, 프로필, 여행 기록, 리캡, 보관함 및 커뮤니티 데이터를 삭제합니다.
      operationId: deleteMyAccount
      responses:
        "200":
          description: 계정 삭제 완료
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - deleted
                    properties:
                      deleted:
                        type: boolean
                        const: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/profile:
    get:
      tags:
        - Me
      summary: 내 온보딩/취향 프로필 조회
      operationId: getMyProfile
      responses:
        "200":
          description: 사용자 프로필
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags:
        - Me
      summary: 내 온보딩/취향 프로필 저장
      description: 온보딩 완료 또는 마이페이지 취향 수정 시 호출합니다.
      operationId: upsertMyProfile
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "200":
          description: 저장된 사용자 프로필
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/tour/places:
    get:
      tags:
        - Tour
      summary: 수동 장소 검색
      description: 위치 권한 없이 사용자가 입력한 장소명, 주소 또는 카테고리로 Soundlog 장소를 검색합니다.
      operationId: searchPlaces
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
          example: 광안리
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 검색된 장소 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceContextListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/tour/nearby-places:
    get:
      tags:
        - Tour
      summary: 현재 좌표 주변 관광지 조회
      description: |
        한국관광공사 위치 기반 관광정보를 Soundlog `PlaceContext`로 정규화해서 반환합니다.
        서비스 키와 TourAPI 호출은 서버에서 관리하는 것을 권장합니다.
      operationId: getNearbyPlaces
      parameters:
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lng"
        - name: radiusMeters
          in: query
          description: 검색 반경. 기본값 2000m.
          schema:
            type: integer
            minimum: 100
            maximum: 20000
            default: 2000
        - name: contentTypes
          in: query
          description: 관광공사 content type 필터. 쉼표 구분.
          schema:
            type: string
            example: "12,15,39"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 주변 관광지 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceContextListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/tour/reverse-geocode:
    get:
      tags:
        - Tour
      summary: 현재 좌표의 한국어 지역명 조회
      description: |
        주변 관광공사 장소가 없을 때 사용할 한국어 지역명과 주소를 반환합니다.
        서버에서 OpenStreetMap Nominatim을 프록시하고 동일 좌표 결과를 캐시합니다.
        결과가 없거나 외부 서비스가 응답하지 않으면 `data`는 `null`입니다.
      operationId: reverseGeocodeLocation
      parameters:
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lng"
      responses:
        "200":
          description: 한국어 지역명 또는 null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceContextNullableResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/home/featured-playlists:
    get:
      tags:
        - Home
      summary: 홈 대표 플레이리스트 조회
      description: 홈 상단 가로 캐러셀에 노출할 지역/장소 기반 추천 플레이리스트입니다.
      operationId: getFeaturedPlaylists
      parameters:
        - name: locationRecommendationEnabled
          in: query
          required: true
          schema:
            type: boolean
          example: true
        - name: recommendationMode
          in: query
          required: true
          description: 홈 상단 토글에서 선택한 추천 모드. 일상 모드는 취향 중심, 여행 모드는 장소/관광 맥락 중심으로 정렬합니다.
          schema:
            $ref: "#/components/schemas/MusicRecommendationMode"
          example: travel
        - $ref: "#/components/parameters/OptionalLat"
        - $ref: "#/components/parameters/OptionalLng"
        - name: placeId
          in: query
          description: 현재 선택된 관광지 ID.
          schema:
            type: string
        - name: travelMode
          in: query
          schema:
            $ref: "#/components/schemas/TravelMode"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 대표 플레이리스트 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedPlaylistListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/home/mood-recommendations:
    get:
      tags:
        - Home
      summary: 홈 무드 추천 카드 조회
      description: 선택한 무드와 정확히 일치하는 카드를 조회하고, 온보딩 취향을 기반으로 결과를 정렬합니다. 전체를 선택하면 모든 카드를 반환합니다.
      operationId: getMoodRecommendations
      parameters:
        - name: moodFilter
          in: query
          required: true
          schema:
            type: string
            default: 전체
          example: 시원한
        - name: recommendationMode
          in: query
          required: true
          description: 음악추천 화면의 추천 모드.
          schema:
            $ref: "#/components/schemas/MusicRecommendationMode"
          example: everyday
        - name: preferredGenres
          in: query
          description: 온보딩 선호 장르. 쉼표 구분.
          schema:
            type: string
          example: "K-POP,인디,팝"
        - name: preferredMoods
          in: query
          description: 온보딩 선호 무드. 쉼표 구분.
          schema:
            type: string
          example: "시원한,잔잔한"
        - name: travelStyles
          in: query
          description: 여행 스타일. 쉼표 구분.
          schema:
            type: string
          example: "산책,카페 투어"
        - name: travelMode
          in: query
          schema:
            $ref: "#/components/schemas/TravelMode"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 무드 추천 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodRecommendationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/home/recent-music-logs:
    get:
      tags:
        - Home
      summary: 최근 Music Log 조회
      description: 홈의 Music Log 영역에 표시할 최근 순간 기록 또는 음악 기록입니다.
      operationId: getRecentMusicLogs
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 최근 Music Log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicLogItemListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/recommendations/playlists:
    get:
      tags:
        - Playlists
      summary: 현재 위치/상태/무드 기반 추천 플레이리스트 조회
      description: |
        앱 홈의 "오늘의 사운드트랙" CTA에서 사용하는 추천 API입니다.
        프론트는 ML 서버를 직접 호출하지 않고 이 API를 통해 Soundlog 서버의 정규화된 플레이리스트 DTO를 받습니다.
      operationId: getRecommendedPlaylist
      parameters:
        - name: x
          in: query
          required: true
          description: 경도
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 126.9963
        - name: y
          in: query
          required: true
          description: 위도
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 37.5104
        - name: state
          in: query
          required: true
          description: 여행 상태
          schema:
            $ref: "#/components/schemas/MlTravelState"
          example: 산책
        - name: mood
          in: query
          required: true
          description: 원하는 음악 무드
          schema:
            $ref: "#/components/schemas/MlMood"
          example: 잔잔한
      responses:
        "200":
          description: 추천 플레이리스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistCurationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/playlists/contextual:
    post:
      tags:
        - Playlists
      summary: 현재 관광 맥락 기반 플레이리스트 생성
      description: |
        좌표, 장소, 여행 모드, 무드 태그, 사용자 취향을 받아 즉시 플레이리스트를 생성하거나 기존 플레이리스트를 추천합니다.
        MVP에서는 `GET /v1/playlists/{playlistId}`보다 후순위로 둘 수 있습니다.
      operationId: createContextualPlaylist
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextualPlaylistRequest"
      responses:
        "201":
          description: 생성된 플레이리스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistCurationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/playlists/{playlistId}:
    get:
      tags:
        - Playlists
      summary: 플레이리스트 상세 조회
      description: 음악 큐레이션 페이지에서 배경 이미지, 추천 사유, 트랙 리스트를 표시합니다.
      operationId: getPlaylist
      parameters:
        - name: playlistId
          in: path
          required: true
          schema:
            type: string
          example: busan-ocean-walk
        - $ref: "#/components/parameters/OptionalLat"
        - $ref: "#/components/parameters/OptionalLng"
        - name: placeId
          in: query
          schema:
            type: string
        - name: travelMode
          in: query
          schema:
            $ref: "#/components/schemas/TravelMode"
        - name: moodTags
          in: query
          description: 무드 태그. 쉼표 구분.
          schema:
            type: string
          example: "fresh,calm"
      responses:
        "200":
          description: 플레이리스트 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistCurationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/library/tracks:
    get:
      tags:
        - Library
      summary: 좋아요/저장 트랙 목록 조회
      operationId: getLibraryTracks
      parameters:
        - name: kind
          in: query
          description: 조회할 보관함 종류.
          schema:
            type: string
            enum:
              - liked
              - saved
              - all
