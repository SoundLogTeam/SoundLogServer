      type: object
      description: 여행 로그 또는 독립 리캡 집계 생성 요청입니다. 여행 로그는 sessionId가 필요하고, 독립 리캡은 세션에 속하지 않은 momentLogIds 정확히 1개가 필요합니다. 공개 로그는 위치가 있고 public인 구성 리캡을 1개 이상 포함해야 합니다. 로컬 여행 세션 ID는 소유한 구성 리캡이 확인되면 종료 세션으로 복구됩니다.
