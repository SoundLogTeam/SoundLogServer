name: Deploy API to EC2

on:
  push:
    branches:
      - main
      - codex/server-deploy-contract-check-fix
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to build and deploy. Defaults to the current commit SHA.
        required: false
        type: string

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Set image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${GITHUB_SHA::12}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            image_tag="${{ inputs.image_tag }}"
          fi

          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_.-]{1,128}$ ]]; then
            echo "Invalid Docker image tag: ${image_tag}"
            exit 1
          fi

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/soundlog-server:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/soundlog-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull and restart on EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          missing=()
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_SSH_PORT EC2_APP_DIR PRODUCTION_ENV; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          for key in API_PORT CLIENT_URL CLIENT_URLS POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB JWT_SECRET; do
            value="$(sed -n "s/^${key}=//p" <<< "$PRODUCTION_ENV" | tail -n 1)"
            if [ -z "$value" ]; then
              missing+=("PRODUCTION_ENV.${key}")
            fi
          done

          if grep -q "^DOCKER_IMAGE=" <<< "$PRODUCTION_ENV"; then
            echo "PRODUCTION_ENV must not include DOCKER_IMAGE. The workflow injects it at deploy time."
            exit 1
          fi

          if grep -q "^DATABASE_URL=" <<< "$PRODUCTION_ENV"; then
            echo "PRODUCTION_ENV must not include DATABASE_URL. The workflow injects an encoded internal database URL at deploy time."
            exit 1
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Create production env file
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          mkdir -p .deploy
          api_port="$(sed -n 's/^API_PORT=//p' <<< "$PRODUCTION_ENV" | tail -n 1 | tr -d '\r')"
          postgres_user="$(sed -n 's/^POSTGRES_USER=//p' <<< "$PRODUCTION_ENV" | tail -n 1 | tr -d '\r')"
          postgres_password="$(sed -n 's/^POSTGRES_PASSWORD=//p' <<< "$PRODUCTION_ENV" | tail -n 1 | tr -d '\r')"
          postgres_db="$(sed -n 's/^POSTGRES_DB=//p' <<< "$PRODUCTION_ENV" | tail -n 1 | tr -d '\r')"

          if [[ ! "$api_port" =~ ^[0-9]+$ ]]; then
            echo "PRODUCTION_ENV.API_PORT must be a numeric port."
            exit 1
          fi

          database_url="$(
            POSTGRES_USER="$postgres_user" POSTGRES_PASSWORD="$postgres_password" POSTGRES_DB="$postgres_db" node <<'NODE'
          const encode = encodeURIComponent;
          const user = encode(process.env.POSTGRES_USER || '');
          const password = encode(process.env.POSTGRES_PASSWORD || '');
          const database = encode(process.env.POSTGRES_DB || '');
          process.stdout.write(`postgresql://${user}:${password}@db:5432/${database}?schema=public`);
          NODE
          )"

          {
            printf 'DOCKER_IMAGE=%s/soundlog-server:%s\n' "$DOCKERHUB_USERNAME" "$IMAGE_TAG"
            printf '%s\n' "$PRODUCTION_ENV" | sed '/^DOCKER_IMAGE=/d;/^DATABASE_URL=/d;/^UPLOAD_PUBLIC_BASE_URL=/d'
            printf 'DATABASE_URL=%s\n' "$database_url"
            printf 'UPLOAD_PUBLIC_BASE_URL=http://%s:%s\n' "$EC2_HOST" "$api_port"
          } > .deploy/production.env

      - name: Prepare EC2 app directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            set -eu
            mkdir -p "${{ secrets.EC2_APP_DIR }}"
            docker --version
            docker compose version

      - name: Copy production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          source: docker-compose.prod.yml
          target: ${{ secrets.EC2_APP_DIR }}
          overwrite: true

      - name: Copy production env file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          source: .deploy/production.env
          target: ${{ secrets.EC2_APP_DIR }}
          strip_components: 1
          overwrite: true

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            set -eu
            cd "${{ secrets.EC2_APP_DIR }}"
            mv production.env .env

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps

            api_port="$(sed -n 's/^API_PORT=//p' .env | tail -n 1 | tr -d '\r')"
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:${api_port}/v1/health" > /tmp/soundlog-health.json; then
                cat /tmp/soundlog-health.json
                docker image prune -f
                exit 0
              fi

              echo "Waiting for API health check on EC2 (${attempt}/18)..."
              sleep 10
            done

            echo "API health check failed on EC2: http://127.0.0.1:${api_port}/v1/health"
            docker compose -f docker-compose.prod.yml logs --tail=120 api
            exit 1

      - name: Sync frontend Vercel API origin
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          FRONTEND_VERCEL_PROJECT: ${{ secrets.FRONTEND_VERCEL_PROJECT }}
          FRONTEND_VERCEL_SCOPE: ${{ secrets.FRONTEND_VERCEL_SCOPE }}
          FRONTEND_VERCEL_TOKEN: ${{ secrets.FRONTEND_VERCEL_TOKEN }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail

          if [ -z "$FRONTEND_VERCEL_TOKEN" ]; then
            echo "Skipping frontend Vercel API origin sync because FRONTEND_VERCEL_TOKEN is not configured."
            exit 0
          fi

          api_port="$(sed -n 's/^API_PORT=//p' <<< "$PRODUCTION_ENV" | tail -n 1 | tr -d '\r')"
          if [[ ! "$api_port" =~ ^[0-9]+$ ]]; then
            echo "PRODUCTION_ENV.API_PORT must be a numeric port."
            exit 1
          fi

          api_origin="http://${EC2_HOST}:${api_port}"
          project="${FRONTEND_VERCEL_PROJECT:-sound-log-app}"
          scope="${FRONTEND_VERCEL_SCOPE:-mannomis-projects}"
          tmpdir="$(mktemp -d)"

          cleanup() {
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          npx --yes vercel@54.20.1 link \
            --yes \
            --scope "$scope" \
            --project "$project" \
            --cwd "$tmpdir" \
            --token "$FRONTEND_VERCEL_TOKEN"

          for environment in preview production; do
            npx --yes vercel@54.20.1 env add SOUNDLOG_API_ORIGIN "$environment" \
              --force \
              --yes \
              --sensitive \
              --value "$api_origin" \
              --cwd "$tmpdir" \
              --scope "$scope" \
              --token "$FRONTEND_VERCEL_TOKEN"
          done

      - name: Verify EC2 API contract
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            set -eu
            cd "${{ secrets.EC2_APP_DIR }}"
            docker compose -f docker-compose.prod.yml exec -T \
              -e PUBLIC_API_BASE_URL=http://127.0.0.1:4000 \
              api \
              node scripts/check-public-api-contract.mjs

      - name: Check EC2 API external reachability
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          api_port="$(sed -n 's/^API_PORT=//p' <<< "$PRODUCTION_ENV" | tail -n 1 | tr -d '\r')"

          if [[ ! "$api_port" =~ ^[0-9]+$ ]]; then
            echo "PRODUCTION_ENV.API_PORT must be a numeric port."
            exit 1
          fi

          if ! curl --fail --silent --show-error --max-time 10 "http://${EC2_HOST}:${api_port}/v1/health" > /tmp/soundlog-external-health.json; then
            echo "::error::EC2 API port is not reachable from the GitHub runner. Open TCP ${api_port} on the EC2 security group/firewall or point SOUNDLOG_API_ORIGIN to a reachable API origin before deploying the frontend."
            exit 1
          fi

          cat /tmp/soundlog-external-health.json
